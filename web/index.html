<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0e0e11;--card:#1a1a1f;--card2:#22222a;--text:#f5f5f5;--muted:#9a9aa3;--line:#2a2a32;--accent:#ff2d55;--accent2:#ff6b81;--topbar-h:58px;--bottomnav-h:64px;--page-shift:14px} /* 1.2.0.8：整体下移，顶部留出间距 */
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
/* 1.2.0.7：feed 标题/简介/右侧栏被播放中的视频盖住的根因——video.bgvid z-index:1，高于无 z-index 的 .shade/.info/.acts；底部导航点了没反应的根因——#view-home 的 display:flex 盖过 section[hidden]，首页永远藏不住。两处都在本版修好，见 [hidden] 兜底与 .slide 的 z-index。
   1.2.0.6 控制中心位置修复：顶栏以前是 sticky——在竖屏 feed（内部滚动容器）里
   和 WebView 里都可能被滚走/顶到奇怪位置。改成 fixed，永远贴在顶部。
   首页 feed 上顶栏用黑渐变盖在视频上（抖音式），其他页用实底色。 */
header{position:fixed;top:var(--page-shift);left:0;right:0;height:var(--topbar-h); /* 1.2.0.8+：顶栏高度写死 58px，内容 padding-top 72px 正好顶到顶栏底边，滚动时内容再也不会跑到顶栏上面 */z-index:90;background:#0e0e11;border-bottom:1px solid var(--line);padding:10px 12px}
/* 1.2.0.8+：删掉首页顶栏的透明渐变——以前首页顶栏是半透明渐变，滚上去的内容会从顶栏后面透出来/露出来；现在所有页面顶栏一律纯黑不透明。 */
body.modal-open{overflow:hidden}
body.modal-open header{display:none}
.topbar{display:flex;align-items:center;gap:10px}
.logo{font-size:21px;font-weight:900;letter-spacing:.5px;color:#fff;white-space:nowrap;cursor:pointer;background:none;border:0;padding:0;font-family:inherit} /* 1.2.0.8：logo 可点击回首页；字号随其他图标同比例缩小 */
.logo b{color:var(--accent)}
.search{flex:1;display:flex;gap:6px}
.search input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:999px;color:var(--text);padding:8px 14px;font-size:14px;outline:none}
.search button{touch-action:manipulation;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer}
/* 1.2.0.6 底部导航（控制中心）加固：fixed bottom + z-index 90，高于播放弹窗
   （.modal z-60）和评论/分享面板（.sheet z-80），所以播放时、详情页里、评论
   面板打开时都始终贴在底部可见，不会被内容盖住、不会跑到顶部、不会随滚动消失。
   顶栏和底栏的高度用 --topbar-h / --bottomnav-h 统一，feed 和弹窗的留白都按它算。 */
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:90;visibility:visible;pointer-events:auto;display:flex;background:rgba(14,14,17,.97);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.bottomnav button{touch-action:manipulation;flex:1;background:none;border:0;color:var(--muted);font-size:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0}
.bottomnav button .ic{font-size:18px;line-height:1} /* 1.2.0.8：图标同比例缩小 */
/* 1.2.0.8+ 抖音风图标：白色描边线条 SVG（stroke=currentColor），不用 emoji。尺寸沿用 1.2.0.8 缩小后的大小。
   1.2.0.8+ 大星星根因：ic() 生成的 svg class 是 ic-svg，但下面所有行内尺寸规则都写成了已不存在的 ic-inline，
   导致按钮外的星星/气泡 SVG 全是无宽高状态——浏览器默认 300×150，display:block 时还会撑满容器宽度，
   卡片/榜单里就变成占满卡片的巨星，feed 简介行的星星也一样巨大并把“13.2万”挤到下一行。
   修：ic-svg 默认写死 14px（按钮里的大尺寸规则优先级更高，不受影响），再把下面所有 ic-inline 改回 ic-svg。 */
.ic-svg{display:block;width:14px;height:14px;vertical-align:-2px}
.bottomnav .ic svg{width:18px;height:18px}
.slide .acts button svg{width:19px;height:19px;margin:0 auto}
.slide .acts span svg.ic-svg{width:11px;height:11px;vertical-align:-1px}
.detail-rail button svg{width:17px;height:17px;margin:0 auto}
.detail-rail span svg.ic-svg{width:11px;height:11px;vertical-align:-1px}
.sharegrid button .ic svg{width:19px;height:19px;margin:0 auto}
.mutebtn svg{width:15px;height:15px;margin:0 auto}
.close svg{width:14px;height:14px;margin:0 auto}
.search button svg{width:14px;height:14px;vertical-align:-2px;margin-right:2px}
.btn svg.ic-svg{width:14px;height:14px;vertical-align:-2px;margin-right:2px}
.meta svg.ic-svg,.detail-stats svg.ic-svg,.card .t p svg.ic-svg,.rankrow p svg.ic-svg,.post .meta svg.ic-svg{width:12px;height:12px;vertical-align:-1px} /* 1.2.0.8+：ic-inline 已不存在，改回 ic-svg，并补上卡片/榜单/帖子里的行内星星尺寸 */
.acts button.faved,.detail-rail button.faved{color:#ffcf3d}
.bottomnav button.on{color:var(--accent);font-weight:700}
main{padding:calc(var(--topbar-h) + var(--page-shift)) 0 calc(var(--bottomnav-h) + 10px); /* 1.2.0.8：内容随顶栏整体下移 */max-width:1100px;margin:0 auto}
#view-cat,#view-rank,#view-posts,#view-me,#view-search{padding:0 12px}
/* 1.2.0.6 抖音式竖屏全屏 feed：卡片占满顶栏与底栏之间的整块区域，不再留白、
   不再圆角、卡片之间不再留缝；首页的提示行删掉（不是抖音的样式，浪费一屏高度）。 */
#view-home{display:flex;flex-direction:column;height:calc(100vh - var(--topbar-h) - var(--page-shift) - var(--bottomnav-h));height:calc(100dvh - var(--topbar-h) - var(--page-shift) - var(--bottomnav-h))} /* 1.2.0.8：feed 高度随整体下移同步扣掉间距 */
section[hidden]{display:none}
[hidden]{display:none !important} /* 1.2.0.7 根因：#view-home 的 ID 选择器 display:flex 优先级高于 section[hidden]，首页 section 设了 hidden 也藏不住，点底部导航切页后首页还盖在上面，看起来像点了没反应。全局 !important 兜底，弹窗/面板的 hidden 也一样。 */
.hint{color:var(--muted);font-size:13px;margin:8px 2px}
.feed{position:relative;flex:1;min-height:0;overflow-y:auto;scroll-snap-type:y mandatory;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;border-radius:0;background:transparent}
.slide{position:relative;height:100%;margin:0;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;cursor:pointer;border-radius:0;background:linear-gradient(160deg,#2b2b35,#141419 60%,#20202a);box-shadow:none;will-change:transform,opacity;transition:opacity .25s ease,transform .25s ease;opacity:.6;transform:scale(.985)}
.slide.active{opacity:1;transform:scale(1)}
.slide img.cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#1c1c22;z-index:0}
.slide .shade{position:absolute;inset:0;z-index:2;background:linear-gradient(180deg,rgba(0,0,0,.15) 0%,transparent 40%,transparent 55%,rgba(0,0,0,.88) 100%)} /* 1.2.0.7：video.bgvid 是 z-index:1，没有 z-index 的 .shade/.info/.acts 会被播起来的视频盖住，标题/简介/右侧栏全看不见（只有 z-4 的静音键可见）。全部抬到视频上面。 */
.slide .info{position:absolute;left:0;right:72px;bottom:12px;padding:18px 14px;z-index:3}
.slide .info h3{font-size:19px;line-height:1.35;margin-bottom:6px}
.slide .info p{color:#d8d8de;font-size:13px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.slide .info p.syn{cursor:pointer}
.slide .info p.syn.expanded{display:block;-webkit-line-clamp:unset} /* 1.2.0.7：feed 卡片默认只显示一行简介，点简介展开完整文案 */
.slide .watchall{touch-action:manipulation;margin-top:10px;background:linear-gradient(135deg,#ffcf3d,#ffb800);color:#221a00;border:0;border-radius:999px;padding:9px 18px;font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.45)} /* 1.2.0.7：feed 卡片上的“看全集”黄按钮，和预览详情页的黄色按钮同款 */
.slide .meta{color:var(--muted);font-size:12px;margin-top:8px}
.slide .acts{position:absolute;right:10px;bottom:26px; /* 1.2.0.8+ 分享/看全集对齐：分享按钮下“分享”文字已删，分享按钮成了右侧栏最后一项，其中心距 .acts 底部 = 按钮半高 22px；看全集按钮中心距 slide 底部约 47.5px（.info bottom 12 + padding 18 + 按钮半高 ~17.5）；26 + 22 ≈ 47.5，两中心齐平（真机字体度量有偏差时 alignShare() 再用实测 rect 微调） */display:flex;flex-direction:column;gap:16px;align-items:center;z-index:3}
.slide .acts button{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.45);color:#fff;font-size:19px;cursor:pointer} /* 1.2.0.8：右侧栏图标同比例缩小 */
.slide .acts button.liked{color:var(--accent);border-color:var(--accent)}
.slide .acts span{font-size:12px;color:#fff;text-align:center;margin-top:-10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:#222}
.card .t{padding:8px 10px}
.card .t h4{font-size:14px;line-height:1.35;height:38px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .t p{color:var(--muted);font-size:12px;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{touch-action:manipulation;background:var(--card);border:1px solid var(--line);color:#ddd;border-radius:999px;padding:7px 13px;font-size:13px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.rankrow{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;cursor:pointer}
.rankrow .no{font-size:20px;font-weight:900;width:30px;text-align:center;color:var(--accent)}
.rankrow img{width:64px;height:86px;object-fit:cover;border-radius:8px}
.rankrow h4{font-size:15px;line-height:1.4}
.rankrow p{color:var(--muted);font-size:12px;margin-top:4px}
.post{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;cursor:pointer}
.post h4{font-size:15px;line-height:1.5}
.post p{color:#cfcfd6;font-size:13px;line-height:1.6;margin-top:6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.post .meta{color:var(--muted);font-size:12px;margin-top:8px}
.mebox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.mebox h3{font-size:16px;margin-bottom:10px}
.mebox input,.mebox select{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:10px;font-size:14px;margin:6px 0;outline:none}
.btn{background:linear-gradient(135deg,#ff2d55,#ff7a59);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-size:14px;cursor:pointer}
.btn.ghost{background:var(--card2);border:1px solid var(--line);color:#ddd}
.btn.watchall{background:linear-gradient(135deg,#ffcf3d,#ffb800);color:#221a00} /* 1.2.0.7：详情页“看全集”黄色按钮（照预览图2） */
.score-badge{display:inline-block;background:#f5c518;color:#111;border-radius:6px;padding:2px 8px;font-weight:800;font-size:13px;margin-right:6px}
.detail-rail{position:absolute;right:10px;bottom:12px;display:flex;flex-direction:column;gap:14px;align-items:center;z-index:2}
.detail-rail button{width:41px;height:41px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.55);color:#fff;font-size:17px;cursor:pointer} /* 1.2.0.8：详情右侧栏图标同比例缩小 */
.detail-rail button.liked{color:var(--accent);border-color:var(--accent)}
.detail-rail span{font-size:12px;color:#fff;text-align:center;margin-top:-10px;text-shadow:0 1px 4px rgba(0,0,0,.8)}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
/* 1.2.0.6：弹窗 z-60 低于底栏 z-90，所以详情/播放打开时底栏仍压在弹窗上面、
   始终可见；弹窗底部留白按底栏高度算，不会被底栏盖住内容。顶栏在弹窗打开时
   由 body.modal-open 隐藏，详情页顶部改用自己的“‹ 返回”按钮（抖音式）。 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:60;overflow-y:auto;padding:12px 12px calc(var(--bottomnav-h) + 20px)}
.modal .box{max-width:900px;margin:0 auto}
.modal video{width:100%;max-height:62vh;background:#000;border-radius:12px}
.modal .close{position:sticky;top:6px;float:right;z-index:2;background:rgba(0,0,0,.6);color:#fff;border:1px solid #555;border-radius:50%;width:33px;height:33px;font-size:16px;cursor:pointer} /* 1.2.0.8：关闭图标同比例缩小 */
.modal h2{font-size:19px;line-height:1.4;margin:12px 0 6px}
.modal .desc{color:#cfcfd6;font-size:13px;line-height:1.7;white-space:pre-wrap}
.modal .eps{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.detail-cover{position:relative;width:100%;max-width:420px;margin:0 auto;border-radius:16px;overflow:hidden;cursor:pointer;min-height:200px;background:linear-gradient(160deg,#2b2b35,#141419)} /* 1.2.0.7：封面加载中/失败时也不是纯黑，有渐变底 + 占位图兜底 */
.detail-cover img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:#222}
.detail-stats{display:flex;gap:16px;flex-wrap:wrap;color:#d8d8de;font-size:14px;margin:10px 0}
.detail-stats b{color:#fff}
.detail-tags{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.desc.clamped{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ep-range{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.ep-range button{background:var(--card2);border:1px solid var(--line);color:#ddd;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.ep-range button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.modal .eps button.watched{border-color:#3a7d4f;color:#9ed6a8}
.modal .eps button.watched::after{content:' ✓'}
.detail-play{width:100%;padding:13px;font-size:16px;margin:12px 0}
.backlink{background:none;border:0;color:#ddd;font-size:14px;cursor:pointer;padding:8px 0}
/* 1.2.0.6 详情页顶部返回（抖音式）：弹窗打开时顶栏已隐藏，详情页自己带返回按钮。 */
.detailback{position:sticky;top:0;z-index:3;display:inline-block;background:rgba(0,0,0,.65);border:1px solid #444;border-radius:999px;padding:8px 16px;margin-bottom:8px}
.modal .eps button{background:var(--card2);border:1px solid var(--line);color:#eee;border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer}
.modal .eps button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.ctl select{background:var(--card2);border:1px solid var(--line);color:#eee;border-radius:8px;padding:8px;font-size:13px}
.empty{color:var(--muted);text-align:center;padding:36px 0;font-size:14px}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;border:1px solid var(--line);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:99;display:none}
footer{color:var(--muted);font-size:12px;text-align:center;padding:18px 0 calc(var(--bottomnav-h) + 18px)}
@media (max-width:640px){.slide .info h3{font-size:17px}}
/* 1.2.0.6：改回抖音式全屏 feed（1.2.0.4 曾改成卡片不占满屏，用户要求照抖音做，
   已改回）。顶栏（logo+搜索）fixed 在顶部、底栏 fixed 在底部，始终保留，播放时也不隐藏；
   feed 卡片占满顶栏与底栏之间的整块区域，无留白、无圆角、无间距。 */
body[data-view="home"] footer{display:none}
.heartpop{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-size:80px;color:#ff2d55;pointer-events:none;animation:pop .7s ease forwards;z-index:5} /* 1.2.0.8+：双击点赞红心动画上限 80px，只在双击时闪 0.7 秒，正常播放时画面中间不出现大图标 */
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}30%{transform:translate(-50%,-50%) scale(1.2);opacity:1}100%{transform:translate(-50%,-50%) scale(1) translateY(-30px);opacity:0}}
.slide video.bgvid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:transparent;z-index:1}
.slide .centerflash{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-size:64px;color:rgba(255,255,255,.9);text-shadow:0 2px 12px rgba(0,0,0,.6);pointer-events:none;z-index:4;opacity:0}
.slide .centerflash.flashshow{animation:flashfade .7s ease forwards}
@keyframes flashfade{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
.slide .mutebtn{position:absolute;top:12px;right:12px;z-index:4;width:31px;height:31px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.45);color:#fff;font-size:15px;cursor:pointer} /* 1.2.0.8：静音图标同比例缩小 */
.slide .prog{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.25);z-index:4;cursor:pointer}
.slide .progfill{height:100%;width:0%;background:var(--accent)}
.feedsentinel{height:8px;scroll-snap-align:start}
.feedretry{display:flex;align-items:center;justify-content:center;min-height:120px;margin:12px;border-radius:16px;background:var(--card);border:1px solid var(--line);color:#fff;font-size:14px;cursor:pointer;scroll-snap-align:start}
.newbanner{position:sticky;top:calc(var(--topbar-h) + var(--page-shift)); /* 1.2.0.8+：以前 top:0，会贴到屏幕最顶上、跑到顶栏上面去；现在顶到顶栏底边 */z-index:40;margin:8px auto;text-align:center;background:var(--accent);color:#fff;border-radius:999px;padding:8px 16px;font-size:14px;cursor:pointer;max-width:320px}
.feedend{display:flex;align-items:center;justify-content:center;height:40%;color:var(--muted);font-size:14px;scroll-snap-align:start}
/* 1.2.0.6：评论/分享面板 z-80 低于底栏 z-90，底栏始终可见；面板底部留白按
   底栏高度算，评论输入框不再被底栏盖住。 */

function alignShare(){
  var slides = document.querySelectorAll('#feed .slide.active');
  if (!slides.length) slides = document.querySelectorAll('#feed .slide');
  for (var i = 0; i < slides.length; i++){
    var s = slides[i];

    var wr = w.getBoundingClientRect(), sr = sh.getBoundingClientRect();
    if (!wr.height || !sr.height) return;
    var delta = (sr.top + sr.height / 2) - (wr.top + wr.height / 2);
    if (Math.abs(delta) > 1){
      var acts = s.querySelector('.acts');
      var cur = parseFloat(window.getComputedStyle(acts).bottom) || 21;
      acts.style.bottom = Math.max(0, cur + delta) + 'px';
    }
  }

/* 封面本地缓存：Cache API 存 /proxy/img 解密后的 JPEG，第二次打开不走网络 */
var COVER_CACHE = 'hg-covers-v1';
function primeCoverCache(root){
  if (!('caches' in window)) return;
  (root || document).querySelectorAll('img[data-raw]').forEach(function(img){

var _refreshTimer = null;
function knownSet(){
  return {ids: store.get('hg_known_ids', []), total: store.get('hg_known_total', 0)};

  store.set('hg_known_ids', ids.slice(0, 60));

async function checkUpdates(silent){
  try {
    var j = await api('/api/videos?page=1');
    var items = itemsOf(j);
    var pg = pagOf(j);
    var known = knownSet();
    var oldIds = {};
    known.ids.forEach(function(id){ oldIds[id] = true; });
    var fresh = items.filter(function(v){ return !oldIds[v.id]; });
    var totalDiff = Math.max(0, pg.total - (known.total || pg.total));
    var newCount = Math.max(fresh.length, totalDiff);
    if (!known.ids.length){
      saveKnown(items.map(function(v){ return v.id; }), pg.total);
      return 0;
    }
    saveKnown(items.map(function(v){ return v.id; }), pg.total);
    if (newCount > 0){
      var banner = $('#newBanner');
      if (banner){
        banner.textContent = '有 ' + newCount + ' 部新更新，点击查看';
        banner.hidden = false;
        banner.onclick = function(){ banner.hidden = true; loadHome(); };
      }
      if (!silent) toast('发现 ' + newCount + ' 部新更新');
      return newCount;
    }
    return 0;
  } catch(e){ return 0; }
}

      st = (d.data && d.data.streams) || d.streams || {};
      playCache[playKey(id, curEp)] = st;
    }
    curStreams = st;
    var want = $('#streamSel').value || 'main';
    var src = st[want] || st.main || st.hevc || st.preview;
    if (!src) throw new Error('未拿到播放地址');
    setPlayerSource(src);
    var fv = findVideo(id);
    if (fv) addHistory(fv, curEp);
    preloadPlay(id, curEp + 1); /* 边播边预加载下一集 */
    /* 续播：上次看到一半，自动跳回上次位置 */
    var prog = getProgress(id);

      var _trySeek = function(){ try { v.currentTime = prog.t; } catch(e){} };
      v.addEventListener('loadedmetadata', _trySeek, {once: true});
      setTimeout(_trySeek, 800);
      toast('已续播到 ' + fmtDur(prog.t));

        store.set('hg_line', next);
        setPlayerSource(src, true);
      }
    });
    v.play().catch(function(){});
  } else if (v.canPlayType('application/vnd.apple.mpegurl')){
    v.src = url;
    v.play().catch(function(){});
    v.addEventListener('error', function(){
      if (!tried){
        var next = (line === 'direct') ? 'proxy' : 'direct';
        store.set('hg_line', next);
        setPlayerSource(src, true);
      }
    }, {once: true});
  } else {
    v.src = url;
  }
}

     点底部导航什么都不发生，看起来像控制中心坏了；现在先关弹窗再回顶部。 */
  pauseAllSlideVideos(null); activeSlideId = null; /* 1.2.0.7：切页先停掉 feed 正在播的视频，否则播着视频切页后声音/播放还在后台跑，看起来像导航没反应 */

   底部导航、搜索按钮、分类/榜单 chip 点了也一定有反应（用户反馈 1.2.0.4 里
   搜索和底部控制点了没反应；实测根因之一是热门标签接口返回 {word,heat}，
   旧代码只读 name/keyword/tag，chip 渲染成空白、点了等于没点）。 */
document.addEventListener('click', function(e){
  var t = e.target;
  if (!t || !t.closest) return;
  /* 注意：底部导航和搜索按钮不在这里处理——它们已有内联 onclick + 直接绑定，
     再加委托就是第三次触发；showView/doSearch 虽有幂等保护，仍以两处为准。 */
  var tag = t.closest('#hotTags .chip[data-tag]');
  if (tag){ $('#q').value = tag.getAttribute('data-tag'); doSearch(tag.getAttribute('data-tag')); return; }
  var cat = t.closest('#catChips [data-cat]');
  if (cat){
    $$('#catChips .chip').forEach(function(x){ x.classList.remove('on'); });
    cat.classList.add('on');
    loadCatVideos(cat.getAttribute('data-cat'));
    return;
  }
  var rank = t.closest('#rankTabs .chip[data-type]');
  if (rank){
    $$('#rankTabs .chip').forEach(function(x){ x.classList.remove('on'); });
    rank.classList.add('on');
    loadRank(rank.getAttribute('data-type'));
    return;
  }
}, true);

$('#video').addEventListener('ended', function(){ if (curVideo){ var total = curDetail && (curDetail.episode_count || curDetail.total_episodes); if (!total || curEp < total) playVideo(curVideo, curEp + 1); } });
$('#video').addEventListener('timeupdate', function(){ if (Math.floor(this.currentTime) % 5 === 0) saveProgress(); });
$('#video').addEventListener('pause', saveProgress);
/* 1.2.0.8：点顶部 logo 直接回首页：停掉视频、关掉弹窗/面板、回到首页 feed 顶部 */
function goHome(){
  try { closePlayer(); } catch(e){}
  try { closeComments(); } catch(e){}
  try { closeShare(); } catch(e){}
  showView('home');
  var f = $('#feed');
  if (f) f.scrollTo({top: 0, behavior: 'smooth'});
  window.scrollTo(0, 0);
}
$('#btnLogoHome').onclick = goHome;
loadHotTags();
loadHome();
handleDeepLink();
